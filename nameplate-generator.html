<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Plate Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root{
    --bg:#1a1918;
    --panel:#211f1e;
    --panel-2:#282624;
    --border:#3a3733;
    --text:#eeeae2;
    --muted:#9c968c;
    --accent:#e8672f;
    --accent-dim:#7a3b1f;
    --ok:#7fae6c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow:hidden;}
  #app{display:flex;height:100vh;width:100vw;}

  #sidebar{
    width:360px;min-width:360px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    height:100%;
  }
  #sidebar-scroll{
    flex:1;overflow-y:auto;padding:22px 22px 12px 22px;
  }
  #sidebar-scroll::-webkit-scrollbar{width:8px;}
  #sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .brand{padding:20px 22px 0 22px;}
  .brand h1{font-size:17px;font-weight:600;margin:0 0 2px 0;letter-spacing:0.2px;}
  .brand p{font-size:12.5px;color:var(--muted);margin:0 0 18px 0;line-height:1.5;}

  .section{margin-bottom:22px;}
  .section-title{
    font-size:11.5px;font-weight:600;color:var(--accent);
    margin:0 0 12px 0;padding-bottom:8px;border-bottom:1px solid var(--border);
  }

  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .row{margin-bottom:14px;}
  .row-split{display:flex;gap:10px;}
  .row-split > div{flex:1;}

  textarea, select, input[type=text], input[type=number]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:8px 10px;
    font-family:'Space Grotesk',sans-serif;font-size:13.5px;outline:none;
    transition:border-color .15s;
  }
  textarea:focus, select:focus, input:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:56px;line-height:1.4;}

  .numfield{position:relative;}
  .numfield input{padding-right:32px;font-family:'JetBrains Mono',monospace;}
  .numfield .unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none;font-family:'JetBrains Mono',monospace;}

  input[type=range]{
    -webkit-appearance:none;width:100%;height:4px;background:var(--border);border-radius:2px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #1a1918;
  }
  .slidewrap{display:flex;align-items:center;gap:10px;}
  .slidewrap input[type=range]{flex:1;}
  .slidewrap .val{width:52px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text);flex-shrink:0;}

  .segbtns{display:flex;gap:6px;}
  .segbtns button{
    flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
    padding:8px 4px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Space Grotesk',sans-serif;
    transition:all .15s;
  }
  .segbtns button.active{background:var(--accent-dim);border-color:var(--accent);color:#fff;}
  .segbtns button:hover:not(.active){border-color:var(--muted);}

  .colorrow{display:flex;align-items:center;gap:10px;}
  .colorrow input[type=color]{
    width:36px;height:32px;border:1px solid var(--border);border-radius:6px;background:none;padding:0;cursor:pointer;
  }
  .colorrow span{font-size:12.5px;color:var(--muted);}

  .checkrow{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .checkrow input{width:15px;height:15px;accent-color:var(--accent);}
  .checkrow label{margin:0;color:var(--text);font-size:13px;cursor:pointer;}

  .readout{
    background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
    padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
    display:flex;justify-content:space-between;
  }
  .readout b{color:var(--text);font-weight:500;}

  #export-bar{
    border-top:1px solid var(--border);padding:16px 22px;background:var(--panel);
    display:flex;flex-direction:column;gap:8px;
  }
  .btn{
    display:block;width:100%;text-align:center;border:none;border-radius:7px;
    padding:11px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;
    transition:transform .1s, filter .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#1a1918;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{border-color:var(--muted);}

  #viewport{flex:1;position:relative;height:100%;}
  #canvas-holder{position:absolute;inset:0;}
  #canvas-holder canvas{display:block;width:100%;height:100%;}

  #hint{
    position:absolute;top:16px;left:16px;font-size:12px;color:var(--muted);
    font-family:'JetBrains Mono',monospace;background:rgba(26,25,24,0.6);padding:6px 10px;border-radius:6px;
    backdrop-filter:blur(4px);
  }
  #loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--muted);font-size:13px;font-family:'JetBrains Mono',monospace;
    transition:opacity .3s;
  }

  @media (max-width:820px){
    #app{flex-direction:column;}
    #sidebar{width:100%;min-width:0;height:52%;border-right:none;border-bottom:1px solid var(--border);}
    #viewport{height:48%;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">
      <h1>Name Plate Generator</h1>
      <p>Design a parametric name plate and export it ready to print.</p>
    </div>
    <div id="sidebar-scroll">

      <div class="section">
        <div class="section-title">TEXT</div>
        <div class="row">
          <label for="textInput">Content (one line per row)</label>
          <textarea id="textInput">YOUR NAME</textarea>
        </div>
        <div class="row">
          <label for="fontSelect">Typeface</label>
          <select id="fontSelect">
            <option value="helvetiker_regular">Helvetiker Regular</option>
            <option value="helvetiker_bold">Helvetiker Bold</option>
            <option value="optimer_regular">Optimer Regular</option>
            <option value="optimer_bold">Optimer Bold</option>
            <option value="gentilis_regular">Gentilis Regular</option>
            <option value="gentilis_bold">Gentilis Bold</option>
          </select>
        </div>
        <div class="row">
          <label>Text height</label>
          <div class="slidewrap">
            <input type="range" id="fontSize" min="4" max="30" step="0.5" value="12">
            <span class="val" id="fontSizeVal">12 mm</span>
          </div>
        </div>
        <div class="row">
          <label>Text depth (raised height)</label>
          <div class="slidewrap">
            <input type="range" id="textDepth" min="0.4" max="6" step="0.2" value="1.2">
            <span class="val" id="textDepthVal">1.2 mm</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">BASE PLATE</div>
        <div class="row">
          <label>Shape</label>
          <div class="segbtns" id="shapeButtons">
            <button data-shape="rounded" class="active">Rounded</button>
            <button data-shape="rect">Rectangle</button>
            <button data-shape="oval">Oval</button>
          </div>
        </div>
        <div class="row checkrow">
          <input type="checkbox" id="autoFit" checked>
          <label for="autoFit">Auto-fit plate to text</label>
        </div>
        <div class="row" id="paddingRow">
          <label>Padding around text</label>
          <div class="slidewrap">
            <input type="range" id="padding" min="2" max="30" step="1" value="10">
            <span class="val" id="paddingVal">10 mm</span>
          </div>
        </div>
        <div class="row row-split" id="manualSizeRow" style="display:none;">
          <div>
            <label>Width</label>
            <div class="numfield"><input type="number" id="plateWidth" value="100"><span class="unit">mm</span></div>
          </div>
          <div>
            <label>Height</label>
            <div class="numfield"><input type="number" id="plateHeight" value="40"><span class="unit">mm</span></div>
          </div>
        </div>
        <div class="row" id="cornerRow">
          <label>Corner radius</label>
          <div class="slidewrap">
            <input type="range" id="cornerRadius" min="0" max="20" step="0.5" value="6">
            <span class="val" id="cornerRadiusVal">6 mm</span>
          </div>
        </div>
        <div class="row">
          <label>Plate thickness</label>
          <div class="slidewrap">
            <input type="range" id="plateThickness" min="1" max="10" step="0.5" value="3">
            <span class="val" id="plateThicknessVal">3 mm</span>
          </div>
        </div>
        <div class="readout"><span>Computed size</span><b id="sizeReadout">— × — mm</b></div>
      </div>

      <div class="section">
        <div class="section-title">MOUNTING HOLES</div>
        <div class="row">
          <label>Layout</label>
          <div class="segbtns" id="holeButtons">
            <button data-holes="none" class="active">None</button>
            <button data-holes="2">2 · sides</button>
            <button data-holes="4">4 · corners</button>
          </div>
        </div>
        <div class="row row-split" id="holeParamsRow" style="display:none;">
          <div>
            <label>Hole diameter</label>
            <div class="numfield"><input type="number" id="holeDiameter" value="4" step="0.5"><span class="unit">mm</span></div>
          </div>
          <div>
            <label>Edge margin</label>
            <div class="numfield"><input type="number" id="holeMargin" value="7" step="0.5"><span class="unit">mm</span></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">PREVIEW COLORS</div>
        <div class="row colorrow">
          <input type="color" id="plateColor" value="#d8d3c8">
          <span>Plate</span>
        </div>
        <div class="row colorrow">
          <input type="color" id="textColor" value="#e8672f">
          <span>Text</span>
        </div>
      </div>

    </div>
    <div id="export-bar">
      <button class="btn btn-primary" id="exportCombined">Download STL (combined)</button>
      <button class="btn btn-secondary" id="exportSeparate">Download STL (body + text, 2 files)</button>
    </div>
  </div>

  <div id="viewport">
    <div id="canvas-holder"></div>
    <div id="hint">drag to orbit · scroll to zoom</div>
    <div id="loading">loading fonts…</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- Scene setup ----------
const holder = document.getElementById('canvas-holder');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15140f);

const camera = new THREE.PerspectiveCamera(32, holder.clientWidth / holder.clientHeight, 0.1, 5000);
camera.up.set(0, 0, 1);
camera.position.set(90, -170, 230);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(holder.clientWidth, holder.clientHeight);
holder.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 30;
controls.maxDistance = 800;

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(60, -120, 160);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(-100, 80, 60);
scene.add(fill);

const grid = new THREE.GridHelper(400, 40, 0x3a3733, 0x262421);
grid.rotation.x = Math.PI / 2;
grid.position.z = -0.01;
scene.add(grid);

function resize() {
  const w = holder.clientWidth, h = holder.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
new ResizeObserver(resize).observe(holder);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---------- Font loading ----------
const FONT_BASE = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/';
const fontLoader = new FontLoader();
const fontCache = {};
function loadFont(name) {
  if (fontCache[name]) return Promise.resolve(fontCache[name]);
  return new Promise((resolve, reject) => {
    fontLoader.load(FONT_BASE + name + '.typeface.json', (font) => {
      fontCache[name] = font;
      resolve(font);
    }, undefined, reject);
  });
}

// ---------- Controls state ----------
const els = {
  text: document.getElementById('textInput'),
  font: document.getElementById('fontSelect'),
  fontSize: document.getElementById('fontSize'),
  textDepth: document.getElementById('textDepth'),
  autoFit: document.getElementById('autoFit'),
  padding: document.getElementById('padding'),
  plateWidth: document.getElementById('plateWidth'),
  plateHeight: document.getElementById('plateHeight'),
  cornerRadius: document.getElementById('cornerRadius'),
  plateThickness: document.getElementById('plateThickness'),
  holeDiameter: document.getElementById('holeDiameter'),
  holeMargin: document.getElementById('holeMargin'),
  plateColor: document.getElementById('plateColor'),
  textColor: document.getElementById('textColor'),
};

let shapeMode = 'rounded';
let holeMode = 'none';

document.getElementById('shapeButtons').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  [...e.currentTarget.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  shapeMode = btn.dataset.shape;
  document.getElementById('cornerRow').style.display = shapeMode === 'rect' || shapeMode === 'rounded' ? 'block' : 'none';
  document.getElementById('cornerRow').style.opacity = shapeMode === 'rounded' ? '1' : '0.35';
  document.getElementById('cornerRow').style.pointerEvents = shapeMode === 'rounded' ? 'auto' : 'none';
  scheduleRebuild();
});

document.getElementById('holeButtons').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  [...e.currentTarget.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  holeMode = btn.dataset.holes;
  document.getElementById('holeParamsRow').style.display = holeMode === 'none' ? 'none' : 'flex';
  scheduleRebuild();
});

els.autoFit.addEventListener('change', () => {
  document.getElementById('paddingRow').style.display = els.autoFit.checked ? 'block' : 'none';
  document.getElementById('manualSizeRow').style.display = els.autoFit.checked ? 'none' : 'flex';
  scheduleRebuild();
});

// live numeric readouts
function bindSlider(input, out, unit) {
  input.addEventListener('input', () => { out.textContent = input.value + ' ' + unit; scheduleRebuild(); });
}
bindSlider(els.fontSize, document.getElementById('fontSizeVal'), 'mm');
bindSlider(els.textDepth, document.getElementById('textDepthVal'), 'mm');
bindSlider(els.padding, document.getElementById('paddingVal'), 'mm');
bindSlider(els.cornerRadius, document.getElementById('cornerRadiusVal'), 'mm');
bindSlider(els.plateThickness, document.getElementById('plateThicknessVal'), 'mm');

[els.text, els.font, els.plateWidth, els.plateHeight, els.holeDiameter, els.holeMargin, els.plateColor, els.textColor]
  .forEach(el => el.addEventListener('input', scheduleRebuild));

let rebuildTimer = null;
function scheduleRebuild() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuild, 180);
}

// ---------- Geometry building ----------
let modelGroup = new THREE.Group();
scene.add(modelGroup);
let lastExportData = null; // { plateGeo, textGeo }

function buildTextGeometries(font, lines, size, depth) {
  const lineHeight = size * 1.35;
  const raw = lines.map(line => {
    if (line.trim() === '') return null;
    const geo = new TextGeometry(line, { font, size, height: depth, curveSegments: 6, bevelEnabled: false });
    geo.computeBoundingBox();
    const width = geo.boundingBox.max.x - geo.boundingBox.min.x;
    return { geo, width, minX: geo.boundingBox.min.x };
  });
  const totalHeight = lines.length * lineHeight;
  const geoms = [];
  raw.forEach((item, i) => {
    if (!item) return;
    const xOff = -item.width / 2 - item.minX;
    const yOff = totalHeight / 2 - i * lineHeight - lineHeight * 0.72;
    item.geo.translate(xOff, yOff, 0);
    geoms.push(item.geo);
  });
  return geoms;
}

function roundedRectShape(w, h, r) {
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  r = Math.min(r, w / 2, h / 2);
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);
  return shape;
}

function ovalShape(w, h) {
  const shape = new THREE.Shape();
  shape.absellipse(0, 0, w / 2, h / 2, 0, Math.PI * 2, false, 0);
  return shape;
}

function addHoles(shape, w, h, mode, diameter, margin) {
  if (mode === 'none') return;
  const r = diameter / 2;
  const hx = w / 2 - margin;
  const hy = h / 2 - margin;
  const positions = mode === '4'
    ? [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]]
    : [[-hx, 0], [hx, 0]];
  positions.forEach(([px, py]) => {
    const hole = new THREE.Path();
    hole.absarc(px, py, r, 0, Math.PI * 2, false);
    shape.holes.push(hole);
  });
}

async function rebuild() {
  const fontName = els.font.value;
  let font;
  try {
    font = await loadFont(fontName);
  } catch (e) {
    console.error('font load failed', e);
    return;
  }
  document.getElementById('loading').style.opacity = '0';
  document.getElementById('loading').style.pointerEvents = 'none';

  const lines = els.text.value.split('\n');
  const size = parseFloat(els.fontSize.value);
  const depth = parseFloat(els.textDepth.value);
  const plateThickness = parseFloat(els.plateThickness.value);

  // clear previous
  while (modelGroup.children.length) {
    const m = modelGroup.children.pop();
    m.geometry.dispose();
    m.material.dispose();
  }

  const textGeoms = buildTextGeometries(font, lines, size, depth);
  let textWidth = size * 4, textHeight = size * 1.6;
  let mergedTextGeo = null;
  if (textGeoms.length) {
    mergedTextGeo = textGeoms.length > 1 ? mergeGeometries(textGeoms, false) : textGeoms[0];
    mergedTextGeo.computeBoundingBox();
    const bb = mergedTextGeo.boundingBox;
    textWidth = bb.max.x - bb.min.x;
    textHeight = bb.max.y - bb.min.y;
  }

  let plateW, plateH;
  if (els.autoFit.checked) {
    const pad = parseFloat(els.padding.value);
    plateW = Math.max(textWidth + pad * 2, 10);
    plateH = Math.max(textHeight + pad * 2, 10);
    els.plateWidth.value = plateW.toFixed(1);
    els.plateHeight.value = plateH.toFixed(1);
  } else {
    plateW = Math.max(parseFloat(els.plateWidth.value) || 10, 5);
    plateH = Math.max(parseFloat(els.plateHeight.value) || 10, 5);
  }

  document.getElementById('sizeReadout').textContent = `${plateW.toFixed(1)} × ${plateH.toFixed(1)} mm`;

  const cornerR = parseFloat(els.cornerRadius.value);
  let shape;
  if (shapeMode === 'rounded') shape = roundedRectShape(plateW, plateH, cornerR);
  else if (shapeMode === 'oval') shape = ovalShape(plateW, plateH);
  else shape = roundedRectShape(plateW, plateH, 0);

  addHoles(shape, plateW, plateH, holeMode, parseFloat(els.holeDiameter.value), parseFloat(els.holeMargin.value));

  const plateGeo = new THREE.ExtrudeGeometry(shape, { depth: plateThickness, bevelEnabled: false, curveSegments: 24 });

  const plateMat = new THREE.MeshStandardMaterial({ color: els.plateColor.value, roughness: 0.55, metalness: 0.05 });
  const plateMesh = new THREE.Mesh(plateGeo, plateMat);
  modelGroup.add(plateMesh);

  if (mergedTextGeo) {
    mergedTextGeo.translate(0, 0, plateThickness);
    const textMat = new THREE.MeshStandardMaterial({ color: els.textColor.value, roughness: 0.5, metalness: 0.05 });
    const textMesh = new THREE.Mesh(mergedTextGeo, textMat);
    modelGroup.add(textMesh);
  }

  // frame camera target roughly on model
  controls.target.set(0, 0, plateThickness / 2);
  const maxDim = Math.max(plateW, plateH);
  if (!rebuild._framed) {
    camera.position.set(0, -maxDim * 1.4, maxDim * 1.1);
    rebuild._framed = true;
  }

  lastExportData = { plateGeo: plateGeo.clone(), textGeo: mergedTextGeo ? mergedTextGeo.clone() : null };
}

// ---------- Export ----------
const exporter = new STLExporter();
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

document.getElementById('exportCombined').addEventListener('click', () => {
  if (!lastExportData) return;
  const geoms = [lastExportData.plateGeo.clone()];
  if (lastExportData.textGeo) geoms.push(lastExportData.textGeo.clone());
  const merged = geoms.length > 1 ? mergeGeometries(geoms, false) : geoms[0];
  const mesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial());
  const stl = exporter.parse(mesh, { binary: true });
  download(new Blob([stl], { type: 'application/octet-stream' }), 'nameplate.stl');
});

document.getElementById('exportSeparate').addEventListener('click', () => {
  if (!lastExportData) return;
  const plateMesh = new THREE.Mesh(lastExportData.plateGeo.clone(), new THREE.MeshStandardMaterial());
  const plateStl = exporter.parse(plateMesh, { binary: true });
  download(new Blob([plateStl], { type: 'application/octet-stream' }), 'nameplate_body.stl');
  if (lastExportData.textGeo) {
    setTimeout(() => {
      const textMesh = new THREE.Mesh(lastExportData.textGeo.clone(), new THREE.MeshStandardMaterial());
      const textStl = exporter.parse(textMesh, { binary: true });
      download(new Blob([textStl], { type: 'application/octet-stream' }), 'nameplate_text.stl');
    }, 400);
  }
});

// ---------- init ----------
rebuild();
</script>
</body>
